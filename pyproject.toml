[project]
name = "pdf-manager"
version = "1.1.1"
description = "A lightweight desktop tool for converting PowerPoint presentations and PDFs into flattened, searchable documents, with OCR and merging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.25,<2",
    "pywin32>=308; sys_platform == 'win32'",
]

[dependency-groups]
# Test-only: python-pptx builds a sample PPTX fixture in tests/smoke_test.py.
dev = [
    "pytest>=8",
    "python-pptx>=1.0,<2",
]

[tool.uv]
# A desktop app run from source, not an installable library.
package = false

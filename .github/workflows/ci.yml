# Automatic checks on every push and pull request (decision F37, audit R7).
#
# - python-linux:   lint, format check and the full pytest suite with Tesseract and
#                   LibreOffice installed, so OCR and slide tests really run.
# - python-windows: the pytest suite on Windows, to exercise Windows-only code paths
#                   (process-tree killing, registry parsing, paths). Tesseract and
#                   LibreOffice aren't installed there, so tests needing them skip.
# - frontend:       typecheck, lint, tests and the single-file production build.
# - linux-startup:  starts the real app (Qt WebEngine via PySide6) under Xvfb in
#                   smoke-test mode: the React UI must render and window.pywebview.api
#                   must answer, then the window closes (decision P17).
# - browser-mode-linux: the production interface in headless Chromium against
#                   main.py --browser (tests/e2e), with Tesseract and LibreOffice.
#
# Windows packaging (PyInstaller + Inno Setup) stays a separate, manual workflow:
# build-windows.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run, saving Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-linux:
    name: Python (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Tesseract (English) and LibreOffice Impress
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng libreoffice-impress
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff check --select F,E9,I,E501 --line-length 100 api converter tests main.py
      - name: Format check
        run: uvx ruff format --check --line-length 100 api converter tests main.py
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider -rs

  python-windows:
    name: Python (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (must be one self-contained index.html)
        run: |
          npm run build
          test "$(ls dist)" = "index.html"

  linux-startup:
    name: Linux start-up (Qt window)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The PySide6 wheels bundle Qt itself; Qt's xcb platform plugin and Qt WebEngine
      # (Chromium) still need these system libraries. xauth is needed by xvfb-run.
      - name: Install Qt WebEngine's system libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth \
            libegl1 libgl1 libopengl0 libgbm1 libdrm2 \
            libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libxcb1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 \
            libnss3 libnspr4 libfontconfig1 libfreetype6 libdbus-1-3 \
            libglib2.0-0t64 libasound2t64
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies (PySide6 is Linux-only)
        run: uv sync --frozen
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # The app checks itself (api/smoke.py) and exits 0 only if the page rendered and
      # the bridge answered. Its own watchdog stops it after about 105 s; `timeout` is a
      # last resort.
      - name: Start the app under Xvfb and check the window
        shell: bash
        env:
          PDF_MANAGER_SMOKE_TEST: "1"
        run: |
          timeout 180 xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            uv run --frozen main.py | tee smoke-test.txt
          grep -q "^SMOKE TEST PASSED" smoke-test.txt
      - name: Keep the app's log if the check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-startup-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  browser-mode-linux:
    name: Browser mode (Linux, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install Tesseract (English) and LibreOffice Impress
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng libreoffice-impress
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Playwright (test-only, never bundled) and a headless Chromium for it.
      - name: Install Python dependencies with the browser-test group
        run: |
          uv sync --frozen --group e2e
          uv run --frozen --no-sync playwright install --with-deps chromium
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # The production interface in a real browser against main.py --browser: all six
      # actions, uploads, downloads, reload, restart, lost connection, Quit.
      - name: Browser-to-Python integration tests
        run: uv run --frozen --no-sync pytest tests/e2e -q -p no:cacheprovider -rs
      - name: Keep the app's log if the tests failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mode-linux-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
